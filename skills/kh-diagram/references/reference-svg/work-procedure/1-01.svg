<text x="40" y="464" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start">절차서는 지금 하는 순서를 있는 그대로 적은 파일입니다. 한 번 적어 두면 새 대화에서도 다시 읽게 합니다.</text>
