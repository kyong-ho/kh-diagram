<rect x="500" y="378" width="420" height="62" rx="4" fill="#fff" stroke="#2C7A4B" stroke-width="1.5"/>
<text x="516" y="406.0" font-size="16" fill="#23272E" font-weight="700" text-anchor="start">⑦ 완료 확인</text>
