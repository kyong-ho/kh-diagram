<text x="516" y="120.0" font-size="16" fill="#23272E" font-weight="700" text-anchor="start">② 누가</text>
<text x="516" y="140.0" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">작성: 홍길동 / 확인: 팀장</text>
<rect x="40" y="196" width="230" height="140" rx="4" fill="#EEF3F8" stroke="#17406D" stroke-width="1.5"/>
<text x="56" y="263.0" font-size="16" fill="#23272E" font-weight="700" text-anchor="start">③ 받는 것</text>
