<text x="40" y="484" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start">맨 위에는 업무 이름을 제목으로 둡니다. 모르는 칸은 &quot;(빈칸: 확인 필요)&quot;로 남깁니다. 사람, 업무는 가짜 예시입니다.</text>
