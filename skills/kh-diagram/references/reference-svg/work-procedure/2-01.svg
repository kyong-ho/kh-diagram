<text x="336" y="250" font-size="12.5" fill="#23272E" font-weight="400" text-anchor="start">1. 메모를 옮겨 적는다</text>
<text x="336" y="272" font-size="12.5" fill="#23272E" font-weight="400" text-anchor="start">2. 파일 이름을 날짜로 바꾼다</text>
<text x="336" y="294" font-size="12.5" fill="#23272E" font-weight="400" text-anchor="start">3. 안건을 순서대로 적는다</text>
<text x="336" y="316" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">…  한 줄에 동작 하나</text>
<rect x="690" y="196" width="230" height="140" rx="4" fill="#EAF5EE" stroke="#2C7A4B" stroke-width="1.5"/>
<text x="706" y="263.0" font-size="16" fill="#23272E" font-weight="700" text-anchor="start">⑤ 만드는 것</text>
<text x="706" y="283.0" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">이번 주 회의록 1개</text>
<path d="M272,266 L318,266" fill="none" stroke="#17406D" stroke-width="2" marker-end="url(#ai)"/>
<path d="M642,266 L688,266" fill="none" stroke="#2C7A4B" stroke-width="2" marker-end="url(#ag)"/>
<rect x="40" y="378" width="420" height="62" rx="4" fill="#FFF6DC" stroke="#17406D" stroke-width="1.5"/>
<text x="56" y="406.0" font-size="16" fill="#23272E" font-weight="700" text-anchor="start">⑥ 주의할 점</text>
