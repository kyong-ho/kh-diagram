<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif" role="img" aria-label="다른 PC에서 이어서 작업하기" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17406D"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2362B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C7A4B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6675"/></marker></defs>
<rect width="960" height="480" fill="#fff"/>
<rect x="8" y="8" width="944" height="464" fill="none" stroke="#17406D" stroke-width="1.5"/>
<text x="36" y="52" font-size="23" fill="#17406D" font-weight="700" text-anchor="start">다른 PC에서 이어서 작업하기</text>
<g stroke="#17406D" stroke-width="1" fill="#fff"><rect x="682" y="442" width="190" height="30"/><rect x="872" y="442" width="80" height="30"/></g>
<text x="692" y="462" font-size="12" fill="#17406D" font-weight="400" text-anchor="start">GitHub 튜토리얼</text>
<text x="882" y="462" font-size="12" fill="#17406D" font-weight="400" text-anchor="start">그림 11-2</text>
<text x="18" y="463" font-size="10" fill="#8A96A5" font-weight="400" text-anchor="start">© KYONGHO ENGINEERING &amp; ARCHITECTS</text>
<rect x="40" y="110" width="240" height="150" rx="4" fill="#fff" stroke="#17406D" stroke-width="1.5"/>
<text x="60" y="146" font-size="16" fill="#17406D" font-weight="700" text-anchor="start">원래 PC</text>
<text x="60" y="176" font-size="13.5" fill="#23272E" font-weight="700" text-anchor="start">① 커밋하고 푸시</text>
<text x="60" y="200" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">Changes가 빈 상태로</text>
<rect x="360" y="110" width="240" height="150" rx="4" fill="#EEF3F8" stroke="#17406D" stroke-width="1.5"/>
<text x="380" y="146" font-size="16" fill="#17406D" font-weight="700" text-anchor="start">GitHub</text>
<text x="380" y="176" font-size="13.5" fill="#23272E" font-weight="700" text-anchor="start">최신 기록이 모이는 곳</text>
<rect x="680" y="110" width="240" height="150" rx="4" fill="#fff" stroke="#2C7A4B" stroke-width="1.5"/>
<text x="700" y="146" font-size="16" fill="#2C7A4B" font-weight="700" text-anchor="start">다른 PC</text>
<text x="700" y="176" font-size="13.5" fill="#23272E" font-weight="700" text-anchor="start">② 처음 한 번: Clone</text>
<text x="700" y="200" font-size="13.5" fill="#23272E" font-weight="700" text-anchor="start">③ 그다음부터: Fetch · Pull</text>
<text x="700" y="226" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">작업 → 커밋 → 푸시</text>
<path d="M282,170 L356,170" fill="none" stroke="#17406D" stroke-width="2" marker-end="url(#ai)"/>
<text x="319" y="160" font-size="12" fill="#17406D" font-weight="700" text-anchor="middle">Push</text>
<path d="M602,170 L676,170" fill="none" stroke="#17406D" stroke-width="2" marker-end="url(#ai)"/>
<text x="639" y="160" font-size="12" fill="#17406D" font-weight="700" text-anchor="middle">Clone</text>
<path d="M676,236 L602,236" fill="none" stroke="#2C7A4B" stroke-width="2" marker-end="url(#ag)"/>
<text x="639" y="256" font-size="12" fill="#2C7A4B" font-weight="700" text-anchor="middle">Push</text>
<path d="M356,236 L282,236" fill="none" stroke="#2C7A4B" stroke-width="2" marker-end="url(#ag)"/>
<text x="319" y="256" font-size="12" fill="#2C7A4B" font-weight="700" text-anchor="middle">Pull</text>
<rect x="40" y="300" width="880" height="60" rx="4" fill="#EAF5EE" stroke="#2C7A4B" stroke-width="1.5"/>
<text x="60" y="336" font-size="13.5" fill="#2C7A4B" font-weight="700" text-anchor="start">원래 PC로 돌아가면 작업 전에 Fetch → Pull. 두 PC 모두 “시작할 때 받고, 끝날 때 올린다”를 지키면 기록이 어긋나지 않습니다.</text>
<text x="40" y="408" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start">Clone은 GitHub의 저장소를 내 PC에 처음 통째로 받는 것, Pull은 이미 받은 저장소에 새 기록만 받는 것입니다.</text>
</svg>