<text x="40" y="426" font-size="23" fill="#17406D" font-weight="700" text-anchor="start">기억할 것은 세 가지뿐입니다</text>
<text x="40" y="456" font-size="15.5" fill="#5A6675" font-weight="400" text-anchor="start">받기 → 작업 → 도장 찍기 → 올리기. 나머지는 해 보면서 익히면 됩니다.</text>
<text x="938" y="27" font-size="10" fill="#8A96A5" font-weight="400" text-anchor="end">© KYONGHO ENGINEERING &amp; ARCHITECTS</text>
<circle cx="200" cy="205" r="100" fill="#EEF3F8" stroke="#17406D" stroke-width="3.5"/>
<text x="200" y="238" font-size="26" fill="#17406D" font-weight="700" text-anchor="middle">받기</text>
<text x="200" y="266" font-size="15.5" fill="#5A6675" font-weight="700" text-anchor="middle">풀 (pull)</text>
<text x="200" y="82" font-size="15" fill="#23272E" font-weight="700" text-anchor="middle">작업 시작할 때 (받을 것이 있으면)</text>
<circle cx="480" cy="205" r="100" fill="#FCEDEB" stroke="#C2362B" stroke-width="3.5"/>
<text x="480" y="238" font-size="26" fill="#C2362B" font-weight="700" text-anchor="middle">도장 찍기</text>
<text x="480" y="266" font-size="15.5" fill="#5A6675" font-weight="700" text-anchor="middle">커밋 (commit)</text>
<text x="480" y="82" font-size="15" fill="#23272E" font-weight="700" text-anchor="middle">한 덩어리가 끝날 때마다</text>
<circle cx="760" cy="205" r="100" fill="#EAF5EE" stroke="#2C7A4B" stroke-width="3.5"/>
<text x="760" y="238" font-size="26" fill="#2C7A4B" font-weight="700" text-anchor="middle">올리기</text>
<text x="760" y="266" font-size="15.5" fill="#5A6675" font-weight="700" text-anchor="middle">푸시 (push)</text>
<text x="760" y="82" font-size="15" fill="#23272E" font-weight="700" text-anchor="middle">도장 찍은 뒤, 하루를 마칠 때</text>
