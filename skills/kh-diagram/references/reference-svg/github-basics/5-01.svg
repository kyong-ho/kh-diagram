<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="960" height="550" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif" role="img" aria-label="시작 화면에서 새 저장소 만들기를 고릅니다" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17406D"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2362B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C7A4B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6675"/></marker></defs>
<rect width="960" height="550" fill="#fff"/>
<rect x="8" y="8" width="944" height="534" fill="none" stroke="#17406D" stroke-width="1.5"/>
<text x="36" y="52" font-size="23" fill="#17406D" font-weight="700" text-anchor="start">시작 화면에서 새 저장소 만들기를 고릅니다</text>
<g stroke="#17406D" stroke-width="1" fill="#fff"><rect x="682" y="512" width="190" height="30"/><rect x="872" y="512" width="80" height="30"/></g>
<text x="692" y="532" font-size="12" fill="#17406D" font-weight="400" text-anchor="start">GitHub 튜토리얼</text>
<text x="882" y="532" font-size="12" fill="#17406D" font-weight="400" text-anchor="start">그림 5-1</text>
<text x="18" y="533" font-size="10" fill="#8A96A5" font-weight="400" text-anchor="start">© KYONGHO ENGINEERING &amp; ARCHITECTS</text>
<rect x="40" y="84" width="540" height="380" rx="8" fill="#fff" stroke="#23272E" stroke-width="1.5"/>
<text x="64" y="130" font-size="20" fill="#23272E" font-weight="700" text-anchor="start">Let&#x27;s get started!</text>
<text x="64" y="158" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">Add a repository to GitHub Desktop to start collaborating</text>
<rect x="64" y="190" width="492" height="46" rx="6" fill="#fff" stroke="#C9D3DF" stroke-width="1.5"/>
<text x="84" y="219" font-size="13.5" fill="#23272E" font-weight="400" text-anchor="start">Create a Tutorial Repository…</text>
<rect x="64" y="252" width="492" height="46" rx="6" fill="#fff" stroke="#C9D3DF" stroke-width="1.5"/>
<text x="84" y="281" font-size="13.5" fill="#23272E" font-weight="400" text-anchor="start">Clone a Repository from the Internet…</text>
<rect x="64" y="314" width="492" height="46" rx="6" fill="#DCE3EC" stroke="#17406D" stroke-width="2"/>
<text x="84" y="343" font-size="13.5" fill="#23272E" font-weight="700" text-anchor="start">Create a New Repository on your Hard Drive…</text>
<rect x="64" y="376" width="492" height="46" rx="6" fill="#fff" stroke="#C9D3DF" stroke-width="1.5"/>
<text x="84" y="405" font-size="13.5" fill="#23272E" font-weight="400" text-anchor="start">Add an Existing Repository from your Hard Drive…</text>
<circle cx="556" cy="337" r="15" fill="#fff"/>
<circle cx="556" cy="337" r="13" fill="#C2362B"/>
<text x="556" y="342" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<circle cx="620" cy="150" r="13" fill="#C2362B"/>
<text x="620" y="155" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<text x="646" y="156" font-size="15" fill="#23272E" font-weight="700" text-anchor="start">Create a New Repository…</text>
<text x="646" y="180" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">세 번째 항목. 내 PC에 새 저장소를 만듭니다</text>
<circle cx="620" cy="270" r="13" fill="#C2362B"/>
<text x="620" y="275" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">2</text>
<text x="646" y="276" font-size="15" fill="#23272E" font-weight="700" text-anchor="start">이 화면이 보이지 않으면</text>
<text x="646" y="300" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">메뉴 File → New Repository…</text>
<text x="646" y="319" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">(두 OS 같음)</text>
<rect x="600" y="352" width="320" height="60" rx="6" fill="#EEF3F8" stroke="#C9D3DF" stroke-width="1"/>
<text x="616" y="376" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">Tutorial Repository는 GitHub가 준비한</text>
<text x="616" y="396" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">연습 과정입니다. 이 튜토리얼에서는 쓰지 않습니다.</text>
<text x="40" y="500" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">실제 화면을 단순하게 그린 그림입니다. 버전에 따라 모양과 위치가 조금 다를 수 있습니다.</text>
</svg>