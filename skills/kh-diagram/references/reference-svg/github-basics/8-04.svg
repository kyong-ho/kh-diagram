<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif" role="img" aria-label="커밋하지 않은 변경이 있을 때 브랜치를 바꾸면" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17406D"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2362B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C7A4B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6675"/></marker></defs>
<rect width="960" height="470" fill="#fff"/>
<rect x="8" y="8" width="944" height="454" fill="none" stroke="#17406D" stroke-width="1.5"/>
<text x="36" y="52" font-size="23" fill="#17406D" font-weight="700" text-anchor="start">커밋하지 않은 변경이 있을 때 브랜치를 바꾸면</text>
<g stroke="#17406D" stroke-width="1" fill="#fff"><rect x="682" y="432" width="190" height="30"/><rect x="872" y="432" width="80" height="30"/></g>
<text x="692" y="452" font-size="12" fill="#17406D" font-weight="400" text-anchor="start">GitHub 튜토리얼</text>
<text x="882" y="452" font-size="12" fill="#17406D" font-weight="400" text-anchor="start">그림 8-4</text>
<text x="18" y="453" font-size="10" fill="#8A96A5" font-weight="400" text-anchor="start">© KYONGHO ENGINEERING &amp; ARCHITECTS</text>
<rect x="40" y="84" width="480" height="300" rx="8" fill="#fff" stroke="#23272E" stroke-width="1.5"/>
<text x="60" y="118" font-size="15.5" fill="#23272E" font-weight="700" text-anchor="start">Switch Branch</text>
<line x1="40" y1="136" x2="520" y2="136" stroke="#C9D3DF"/>
<text x="60" y="164" font-size="13" fill="#23272E" font-weight="400" text-anchor="start">You have changes on this branch.</text>
<text x="60" y="184" font-size="13" fill="#23272E" font-weight="400" text-anchor="start">What would you like to do with them?</text>
<circle cx="69" cy="219" r="8.5" fill="#fff" stroke="#17406D" stroke-width="1.8"/>
<circle cx="69" cy="219" r="4.5" fill="#17406D"/>
<text x="86" y="224" font-size="13.5" fill="#23272E" font-weight="400" text-anchor="start">Leave my changes on work</text>
<text x="86" y="244" font-size="12" fill="#5A6675" font-weight="400" text-anchor="start"></text>
<circle cx="69" cy="265" r="8.5" fill="#fff" stroke="#17406D" stroke-width="1.8"/>
<text x="86" y="270" font-size="13.5" fill="#23272E" font-weight="400" text-anchor="start">Bring my changes to main</text>
<line x1="40" y1="320" x2="520" y2="320" stroke="#C9D3DF"/>
<rect x="364" y="334" width="136" height="34" rx="5" fill="#2F6FDE" stroke="#2F6FDE" stroke-width="1.5"/>
<text x="432.0" y="356.0" font-size="13.5" fill="#fff" font-weight="700" text-anchor="middle">Switch Branch</text>
<rect x="280" y="334" width="76" height="34" rx="5" fill="#fff" stroke="#C9D3DF" stroke-width="1.5"/>
<text x="318.0" y="356.0" font-size="13.5" fill="#23272E" font-weight="400" text-anchor="middle">Cancel</text>
<circle cx="268" cy="351" r="15" fill="#fff"/>
<circle cx="268" cy="351" r="13" fill="#C2362B"/>
<text x="268" y="356" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<rect x="560" y="110" width="360" height="230" rx="8" fill="#EEF3F8" stroke="#17406D" stroke-width="1.5"/>
<text x="580" y="142" font-size="15" fill="#17406D" font-weight="700" text-anchor="start">이 튜토리얼의 규칙</text>
<text x="580" y="176" font-size="14" fill="#23272E" font-weight="700" text-anchor="start">① 이 창이 뜨면 Cancel</text>
<text x="580" y="204" font-size="14" fill="#23272E" font-weight="700" text-anchor="start">② 지금 브랜치에서 먼저 커밋</text>
<text x="580" y="232" font-size="14" fill="#23272E" font-weight="700" text-anchor="start">③ 그다음 브랜치를 바꿈</text>
<text x="580" y="272" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">두 선택지는 변경을 잠시 보관하거나(stash)</text>
<text x="580" y="292" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">다른 브랜치로 옮기는 기능입니다.</text>
<text x="580" y="312" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">처음에는 쓰지 않습니다.</text>
<text x="40" y="420" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start">브랜치를 바꾸기 전에 Changes가 비어 있는지 보는 습관을 들이면 이 창을 만날 일이 없습니다.</text>
