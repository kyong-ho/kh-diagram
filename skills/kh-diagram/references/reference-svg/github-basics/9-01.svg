<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif" role="img" aria-label="PR은 요청이고, 병합은 실제로 합치는 것입니다" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17406D"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2362B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C7A4B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6675"/></marker></defs>
<rect width="960" height="440" fill="#fff"/>
<rect x="8" y="8" width="944" height="424" fill="none" stroke="#17406D" stroke-width="1.5"/>
<text x="36" y="52" font-size="23" fill="#17406D" font-weight="700" text-anchor="start">PR은 요청이고, 병합은 실제로 합치는 것입니다</text>
<g stroke="#17406D" stroke-width="1" fill="#fff"><rect x="682" y="402" width="190" height="30"/><rect x="872" y="402" width="80" height="30"/></g>
<text x="692" y="422" font-size="12" fill="#17406D" font-weight="400" text-anchor="start">GitHub 튜토리얼</text>
<text x="882" y="422" font-size="12" fill="#17406D" font-weight="400" text-anchor="start">그림 9-1</text>
<text x="18" y="423" font-size="10" fill="#8A96A5" font-weight="400" text-anchor="start">© KYONGHO ENGINEERING &amp; ARCHITECTS</text>
<rect x="40" y="100" width="270" height="150" rx="4" fill="#fff" stroke="#17406D" stroke-width="1.5"/>
<text x="62" y="136" font-size="17" fill="#23272E" font-weight="700" text-anchor="start">① PR 만들기</text>
<text x="62" y="172" font-size="13.5" fill="#23272E" font-weight="400" text-anchor="start">work → main</text>
<text x="62" y="204" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start">“합쳐 주세요” 요청</text>
<path d="M312,175 L338,175" fill="none" stroke="#17406D" stroke-width="2" marker-end="url(#ai)"/>
<rect x="340" y="100" width="270" height="150" rx="4" fill="#fff" stroke="#17406D" stroke-width="1.5"/>
<text x="362" y="136" font-size="17" fill="#23272E" font-weight="700" text-anchor="start">② 검토</text>
<text x="362" y="172" font-size="13.5" fill="#23272E" font-weight="400" text-anchor="start">바뀐 내용 확인</text>
<text x="362" y="204" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start">의견·수정 요청</text>
<path d="M612,175 L638,175" fill="none" stroke="#17406D" stroke-width="2" marker-end="url(#ai)"/>
<rect x="640" y="100" width="270" height="150" rx="4" fill="#EAF5EE" stroke="#2C7A4B" stroke-width="1.5"/>
<text x="662" y="136" font-size="17" fill="#2C7A4B" font-weight="700" text-anchor="start">③ 병합 (merge)</text>
<text x="662" y="172" font-size="13.5" fill="#23272E" font-weight="400" text-anchor="start">Merge pull request</text>
<text x="662" y="204" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start">이때 main이 바뀜</text>
<path d="M475,250 C 475,312 330,312 330,254" fill="none" stroke="#C2362B" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="6 4"/>
<text x="402" y="330" font-size="13" fill="#C2362B" font-weight="700" text-anchor="middle">수정 요청이 오면 work에서 고쳐 다시 푸시 → 같은 PR에 반영</text>
<text x="40" y="386" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start">PR을 만들어도 main은 그대로입니다. ③ 병합을 눌러야 main에 들어갑니다. 혼자 쓰는 저장소에서는 ②를 스스로 확인합니다.</text>
</svg>