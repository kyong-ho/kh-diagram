<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif" role="img" aria-label="위쪽 오른쪽 버튼은 상황에 따라 이름이 바뀝니다" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17406D"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2362B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C7A4B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6675"/></marker></defs>
<rect width="960" height="500" fill="#fff"/>
<rect x="8" y="8" width="944" height="484" fill="none" stroke="#17406D" stroke-width="1.5"/>
<text x="36" y="52" font-size="23" fill="#17406D" font-weight="700" text-anchor="start">위쪽 오른쪽 버튼은 상황에 따라 이름이 바뀝니다</text>
<g stroke="#17406D" stroke-width="1" fill="#fff"><rect x="682" y="462" width="190" height="30"/><rect x="872" y="462" width="80" height="30"/></g>
<text x="692" y="482" font-size="12" fill="#17406D" font-weight="400" text-anchor="start">GitHub 튜토리얼</text>
<text x="882" y="482" font-size="12" fill="#17406D" font-weight="400" text-anchor="start">그림 6-3</text>
<text x="18" y="483" font-size="10" fill="#8A96A5" font-weight="400" text-anchor="start">© KYONGHO ENGINEERING &amp; ARCHITECTS</text>
<rect x="40" y="90" width="300" height="62" rx="6" fill="#2B3138" stroke="#2B3138" stroke-width="1.5"/>
<text x="60" y="116" font-size="15" fill="#fff" font-weight="700" text-anchor="start">Publish repository</text>
<text x="60" y="138" font-size="12.5" fill="#AEB8C4" font-weight="700" text-anchor="start">GitHub에 아직 없음</text>
<text x="370" y="118" font-size="15" fill="#23272E" font-weight="700" text-anchor="start">5장에서 한 번 누름</text>
<text x="370" y="140" font-size="13" fill="#5A6675" font-weight="400" text-anchor="start">처음 올리기(게시)</text>
<rect x="40" y="176" width="300" height="62" rx="6" fill="#2B3138" stroke="#2B3138" stroke-width="1.5"/>
<text x="60" y="202" font-size="15" fill="#fff" font-weight="700" text-anchor="start">Fetch origin</text>
<text x="60" y="224" font-size="12.5" fill="#AEB8C4" font-weight="700" text-anchor="start">확인할 것만 있음</text>
<text x="370" y="204" font-size="15" fill="#23272E" font-weight="700" text-anchor="start">눌러도 내 파일은 바뀌지 않음</text>
<text x="370" y="226" font-size="13" fill="#5A6675" font-weight="400" text-anchor="start">GitHub에 새 소식이 있는지 확인</text>
<rect x="40" y="262" width="300" height="62" rx="6" fill="#2B3138" stroke="#2B3138" stroke-width="1.5"/>
<text x="60" y="288" font-size="15" fill="#fff" font-weight="700" text-anchor="start">Push origin</text>
<text x="60" y="310" font-size="12.5" fill="#7CCF9C" font-weight="700" text-anchor="start">↑1</text>
<text x="370" y="290" font-size="15" fill="#23272E" font-weight="700" text-anchor="start">올릴 커밋이 1개 있음</text>
<text x="370" y="312" font-size="13" fill="#5A6675" font-weight="400" text-anchor="start">누르면 GitHub로 올라감(푸시)</text>
<rect x="40" y="348" width="300" height="62" rx="6" fill="#2B3138" stroke="#2B3138" stroke-width="1.5"/>
<text x="60" y="374" font-size="15" fill="#fff" font-weight="700" text-anchor="start">Pull origin</text>
<text x="60" y="396" font-size="12.5" fill="#8FB8E6" font-weight="700" text-anchor="start">↓1</text>
<text x="370" y="376" font-size="15" fill="#23272E" font-weight="700" text-anchor="start">받을 커밋이 1개 있음</text>
<text x="370" y="398" font-size="13" fill="#5A6675" font-weight="400" text-anchor="start">누르면 내 PC로 내려옴(풀)</text>
<text x="40" y="448" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start">Push와 Pull이 둘 다 필요하면 Pull을 먼저 합니다. 작업을 시작할 때는 Fetch origin을 한 번 누르는 습관을 들입니다.</text>
</svg>