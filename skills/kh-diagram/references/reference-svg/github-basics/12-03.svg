<text x="40" y="432" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start">비밀.txt는 폴더에 있지만 Changes에 나타나지 않고, 커밋·푸시되지 않습니다. *는 &#x27;아무 이름&#x27;이라는 뜻으로,</text>
<text x="40" y="454" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start">*.env는 이름이 .env로 끝나는 모든 파일, data/는 data 폴더 전체를 뜻합니다.</text>
