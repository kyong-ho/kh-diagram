<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif" role="img" aria-label="충돌은 같은 곳을 양쪽에서 다르게 고쳤을 때만 납니다" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17406D"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2362B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C7A4B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6675"/></marker></defs>
<rect width="960" height="540" fill="#fff"/>
<rect x="8" y="8" width="944" height="524" fill="none" stroke="#17406D" stroke-width="1.5"/>
<text x="36" y="52" font-size="23" fill="#17406D" font-weight="700" text-anchor="start">충돌은 같은 곳을 양쪽에서 다르게 고쳤을 때만 납니다</text>
<g stroke="#17406D" stroke-width="1" fill="#fff"><rect x="682" y="502" width="190" height="30"/><rect x="872" y="502" width="80" height="30"/></g>
<text x="692" y="522" font-size="12" fill="#17406D" font-weight="400" text-anchor="start">GitHub 튜토리얼</text>
<text x="882" y="522" font-size="12" fill="#17406D" font-weight="400" text-anchor="start">그림 10-1</text>
<text x="18" y="523" font-size="10" fill="#8A96A5" font-weight="400" text-anchor="start">© KYONGHO ENGINEERING &amp; ARCHITECTS</text>
<text x="40" y="102" font-size="16" fill="#2C7A4B" font-weight="700" text-anchor="start">다른 곳을 고쳤을 때</text>
<rect x="40" y="116" width="410" height="70" rx="4" fill="#fff" stroke="#17406D" stroke-width="1.5"/>
<text x="58" y="144" font-size="13" fill="#17406D" font-weight="700" text-anchor="start">work에서</text>
<text x="58" y="168" font-size="15" fill="#23272E" font-weight="700" text-anchor="start">README의 소개 문장을 고침</text>
<rect x="510" y="116" width="410" height="70" rx="4" fill="#fff" stroke="#2C7A4B" stroke-width="1.5"/>
<text x="528" y="144" font-size="13" fill="#2C7A4B" font-weight="700" text-anchor="start">main에서</text>
<text x="528" y="168" font-size="15" fill="#23272E" font-weight="700" text-anchor="start">회의록 양식을 고침</text>
<text x="480" y="158" font-size="24" fill="#5A6675" font-weight="700" text-anchor="middle">+</text>
<path d="M245,186 L245,208" fill="none" stroke="#5A6675" stroke-width="1.5" marker-end="url(#am)"/>
<path d="M715,186 L715,208" fill="none" stroke="#5A6675" stroke-width="1.5" marker-end="url(#am)"/>
<rect x="40" y="210" width="880" height="44" rx="4" fill="#EAF5EE" stroke="#2C7A4B" stroke-width="1.5"/>
<text x="58" y="238" font-size="14.5" fill="#2C7A4B" font-weight="700" text-anchor="start">서로 다른 곳이라 Git이 자동으로 합칩니다. 충돌 없음</text>
<text x="40" y="310" font-size="16" fill="#C2362B" font-weight="700" text-anchor="start">같은 곳을 다르게 고쳤을 때</text>
<rect x="40" y="324" width="410" height="70" rx="4" fill="#fff" stroke="#17406D" stroke-width="1.5"/>
<text x="58" y="352" font-size="13" fill="#17406D" font-weight="700" text-anchor="start">work에서</text>
<text x="58" y="376" font-size="15" fill="#23272E" font-weight="700" text-anchor="start">소개 문장 끝에 (A)를 붙임</text>
<rect x="510" y="324" width="410" height="70" rx="4" fill="#fff" stroke="#2C7A4B" stroke-width="1.5"/>
<text x="528" y="352" font-size="13" fill="#2C7A4B" font-weight="700" text-anchor="start">main에서</text>
<text x="528" y="376" font-size="15" fill="#23272E" font-weight="700" text-anchor="start">소개 문장 끝에 (B)를 붙임</text>
<text x="480" y="366" font-size="24" fill="#5A6675" font-weight="700" text-anchor="middle">+</text>
<path d="M245,394 L245,416" fill="none" stroke="#5A6675" stroke-width="1.5" marker-end="url(#am)"/>
<path d="M715,394 L715,416" fill="none" stroke="#5A6675" stroke-width="1.5" marker-end="url(#am)"/>
<rect x="40" y="418" width="880" height="44" rx="4" fill="#FCEDEB" stroke="#C2362B" stroke-width="1.5"/>
<text x="58" y="446" font-size="14.5" fill="#C2362B" font-weight="700" text-anchor="start">같은 줄입니다. 어느 쪽이 맞는지 Git은 판단하지 않습니다. 사람이 정해야 합니다 = 충돌</text>
<text x="40" y="498" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start">충돌은 고장이 아닙니다. “둘 중 어느 쪽이 맞나요?”라는 Git의 질문입니다.</text>
</svg>