<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif" role="img" aria-label="되돌리기는 커밋·푸시 여부에 따라 방법이 다릅니다" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17406D"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2362B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C7A4B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6675"/></marker></defs>
<rect width="960" height="500" fill="#fff"/>
<rect x="8" y="8" width="944" height="484" fill="none" stroke="#17406D" stroke-width="1.5"/>
<text x="36" y="52" font-size="23" fill="#17406D" font-weight="700" text-anchor="start">되돌리기는 커밋·푸시 여부에 따라 방법이 다릅니다</text>
<g stroke="#17406D" stroke-width="1" fill="#fff"><rect x="682" y="462" width="190" height="30"/><rect x="872" y="462" width="80" height="30"/></g>
<text x="692" y="482" font-size="12" fill="#17406D" font-weight="400" text-anchor="start">GitHub 튜토리얼</text>
<text x="882" y="482" font-size="12" fill="#17406D" font-weight="400" text-anchor="start">그림 7-1</text>
<text x="18" y="483" font-size="10" fill="#8A96A5" font-weight="400" text-anchor="start">© KYONGHO ENGINEERING &amp; ARCHITECTS</text>
<rect x="60" y="84" width="240" height="56" rx="28" fill="#EEF3F8" stroke="#17406D" stroke-width="1.5"/>
<text x="180" y="118" font-size="15.5" fill="#17406D" font-weight="700" text-anchor="middle">이미 커밋했나요?</text>
<rect x="500" y="84" width="260" height="56" rx="28" fill="#EEF3F8" stroke="#17406D" stroke-width="1.5"/>
<text x="630" y="118" font-size="15.5" fill="#17406D" font-weight="700" text-anchor="middle">GitHub에 올렸나요(푸시)?</text>
<path d="M300,112 L496,112" fill="none" stroke="#17406D" stroke-width="2" marker-end="url(#ai)"/>
<text x="398" y="102" font-size="13.5" fill="#17406D" font-weight="700" text-anchor="middle">예</text>
<path d="M180,140 L180,236" fill="none" stroke="#17406D" stroke-width="2" marker-end="url(#ai)"/>
<text x="192" y="194" font-size="13.5" fill="#17406D" font-weight="700" text-anchor="start">아니요</text>
<path d="M590,140 L490,236" fill="none" stroke="#17406D" stroke-width="2" marker-end="url(#ai)"/>
<text x="520" y="194" font-size="13.5" fill="#17406D" font-weight="700" text-anchor="end">아니요</text>
<path d="M670,140 L770,236" fill="none" stroke="#17406D" stroke-width="2" marker-end="url(#ai)"/>
<text x="740" y="194" font-size="13.5" fill="#17406D" font-weight="700" text-anchor="start">예</text>
<rect x="40" y="240" width="280" height="160" rx="4" fill="#fff" stroke="#17406D" stroke-width="1.5"/>
<text x="58" y="272" font-size="16.5" fill="#17406D" font-weight="700" text-anchor="start">Discard Changes</text>
<text x="58" y="298" font-size="13.5" fill="#23272E" font-weight="700" text-anchor="start">커밋 전 변경 버리기</text>
<text x="58" y="328" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">· 고른 파일만, 마지막 커밋 상태로</text>
<text x="58" y="350" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">· 기록에 남지 않음</text>
<text x="58" y="372" font-size="12.5" fill="#C2362B" font-weight="700" text-anchor="start">· 필요한 수정도 같이 사라짐</text>
<rect x="340" y="240" width="280" height="160" rx="4" fill="#fff" stroke="#17406D" stroke-width="1.5"/>
<text x="358" y="272" font-size="16.5" fill="#17406D" font-weight="700" text-anchor="start">Undo</text>
<text x="358" y="298" font-size="13.5" fill="#23272E" font-weight="700" text-anchor="start">방금 한 커밋 취소</text>
<text x="358" y="328" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">· 가장 최근 커밋 하나만</text>
<text x="358" y="350" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">· 변경은 Changes로 돌아옴</text>
<text x="358" y="372" font-size="12.5" fill="#C2362B" font-weight="700" text-anchor="start">· 푸시하기 전에만 보임</text>
<rect x="640" y="240" width="280" height="160" rx="4" fill="#fff" stroke="#2C7A4B" stroke-width="1.5"/>
<text x="658" y="272" font-size="16.5" fill="#2C7A4B" font-weight="700" text-anchor="start">Revert Changes in Commit</text>
<text x="658" y="298" font-size="13.5" fill="#23272E" font-weight="700" text-anchor="start">변경을 취소하는 새 커밋</text>
<text x="658" y="328" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">· 고른 커밋 하나의 변경만</text>
<text x="658" y="350" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">· 실수한 커밋도 기록에 남음</text>
<text x="658" y="372" font-size="12.5" fill="#C2362B" font-weight="700" text-anchor="start">· 폴더 전체를 되감는 것이 아님</text>
<text x="40" y="440" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start">여러 커밋을 한꺼번에 되감고 싶거나, 되돌리다 충돌(10장) 안내가 뜨면 직접 해결하지 말고 멈춘 뒤 도움을 요청합니다.</text>
</svg>