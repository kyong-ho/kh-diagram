<text x="618" y="187" font-size="14.5" fill="#23272E" font-weight="700" text-anchor="start">우리 부서가 하는 일</text>
<rect x="600" y="228" width="320" height="54" rx="4" fill="#fff" stroke="#C2362B" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="618" y="261" font-size="14.5" fill="#23272E" font-weight="700" text-anchor="start">어제 다른 대화에서 정한 것</text>
<rect x="600" y="302" width="320" height="54" rx="4" fill="#fff" stroke="#C2362B" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="618" y="335" font-size="14.5" fill="#23272E" font-weight="700" text-anchor="start">내 머릿속의 &quot;보기 좋은 모양&quot;</text>
<path d="M600,183 L560,183 L560,300 L544,300" fill="none" stroke="#2C7A4B" stroke-width="2" marker-end="url(#ag)"/>
<text x="600" y="400" font-size="13.5" fill="#2C7A4B" font-weight="700" text-anchor="start">말해 주거나 파일로 넣어 주면</text>
<text x="600" y="422" font-size="13.5" fill="#2C7A4B" font-weight="700" text-anchor="start">봉투 안으로 들어가 AI가 압니다</text>
<text x="40" y="486" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start">결과가 이상하면 AI를 탓하기 전에 봉투에서 무엇이 빠졌는지 찾습니다.</text>
