<text x="18" y="523" font-size="10" fill="#8A96A5" font-weight="400" text-anchor="start">© KYONGHO ENGINEERING &amp; ARCHITECTS</text>
<rect x="40" y="110" width="500" height="330" rx="6" fill="#EEF3F8" stroke="#17406D" stroke-width="2"/>
<path d="M40,110 L290.0,170 L540,110" fill="none" stroke="#17406D" stroke-width="2" stroke-linejoin="round"/>
<text x="290.0" y="96" font-size="15" fill="#17406D" font-weight="700" text-anchor="middle">컨텍스트 (AI가 지금 보고 있는 것)</text>
<rect x="64" y="200" width="216" height="84" rx="4" fill="#fff" stroke="#17406D" stroke-width="1.5"/>
<text x="80" y="239.0" font-size="16" fill="#23272E" font-weight="700" text-anchor="start">① 기본 규칙</text>
<text x="80" y="259.0" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">원래 갖고 있는 지식</text>
<rect x="300" y="200" width="216" height="84" rx="4" fill="#fff" stroke="#17406D" stroke-width="1.5"/>
<text x="316" y="239.0" font-size="16" fill="#23272E" font-weight="700" text-anchor="start">② AGENTS.md</text>
<text x="316" y="259.0" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">폴더의 업무 안내서</text>
