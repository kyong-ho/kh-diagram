<text x="316" y="349.0" font-size="16" fill="#23272E" font-weight="700" text-anchor="start">④ 지금까지의 대화</text>
<text x="316" y="369.0" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">이 대화창의 말</text>
<text x="600" y="134" font-size="15" fill="#C2362B" font-weight="700" text-anchor="start">봉투 밖: AI가 모릅니다</text>
