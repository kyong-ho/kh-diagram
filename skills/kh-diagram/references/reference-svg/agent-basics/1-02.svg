<text x="555" y="324" font-size="13.5" fill="#C2362B" font-weight="700" text-anchor="middle">문제가 있으면 ③으로 돌아갑니다</text>
<text x="190" y="108" font-size="13.5" fill="#17406D" font-weight="700" text-anchor="start">에이전트가 직접, 여러 번 도는 구간 (②~⑤)</text>
<path d="M190,124 L190,116 L770,116 L770,124" fill="none" stroke="#17406D" stroke-width="1.5"/>
<text x="40" y="384" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start">챗봇은 ①에서 바로 ⑥으로 갑니다. 에이전트는 ②~⑤를 되풀이하므로 오래 걸리지만 더 많은 일을 끝냅니다.</text>
