<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif" role="img" aria-label="에이전트는 확인에서 문제가 있으면 다시 계획합니다">
<defs><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17406D"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2362B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C7A4B"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6675"/></marker></defs>
<rect width="960" height="460" fill="#fff"/>
<rect x="8" y="8" width="944" height="444" fill="none" stroke="#17406D" stroke-width="1.5"/>
<text x="36" y="52" font-size="23" fill="#17406D" font-weight="700" text-anchor="start">에이전트는 확인에서 문제가 있으면 다시 계획합니다</text>
<g stroke="#17406D" stroke-width="1" fill="#fff"><rect x="682" y="422" width="190" height="30"/><rect x="872" y="422" width="80" height="30"/></g>
<text x="692" y="442" font-size="12" fill="#17406D" font-weight="400" text-anchor="start">에이전트 기초 가이드</text>
<text x="882" y="442" font-size="12" fill="#17406D" font-weight="400" text-anchor="start">그림 1-2</text>
<text x="18" y="443" font-size="10" fill="#8A96A5" font-weight="400" text-anchor="start">© KYONGHO ENGINEERING &amp; ARCHITECTS</text>
<rect x="40" y="150" width="130" height="84" rx="4" fill="#fff" stroke="#17406D" stroke-width="1.5"/>
<text x="54" y="184" font-size="15" fill="#23272E" font-weight="700" text-anchor="start">① 목표 받기</text>
<text x="54" y="210" font-size="12" fill="#5A6675" font-weight="400" text-anchor="start">할 일을 듣습니다</text>
<path d="M172,192 L188,192" fill="none" stroke="#17406D" stroke-width="2" marker-end="url(#ai)"/>
<rect x="190" y="150" width="130" height="84" rx="4" fill="#EEF3F8" stroke="#17406D" stroke-width="1.5"/>
<text x="204" y="184" font-size="15" fill="#23272E" font-weight="700" text-anchor="start">② 상황 파악</text>
<text x="204" y="210" font-size="12" fill="#5A6675" font-weight="400" text-anchor="start">폴더를 살펴봅니다</text>
<path d="M322,192 L338,192" fill="none" stroke="#17406D" stroke-width="2" marker-end="url(#ai)"/>
<rect x="340" y="150" width="130" height="84" rx="4" fill="#EEF3F8" stroke="#17406D" stroke-width="1.5"/>
<text x="354" y="184" font-size="15" fill="#23272E" font-weight="700" text-anchor="start">③ 계획</text>
<text x="354" y="210" font-size="12" fill="#5A6675" font-weight="400" text-anchor="start">순서를 정합니다</text>
<path d="M472,192 L488,192" fill="none" stroke="#17406D" stroke-width="2" marker-end="url(#ai)"/>
<rect x="490" y="150" width="130" height="84" rx="4" fill="#EEF3F8" stroke="#17406D" stroke-width="1.5"/>
<text x="504" y="184" font-size="15" fill="#23272E" font-weight="700" text-anchor="start">④ 실행</text>
<text x="504" y="210" font-size="12" fill="#5A6675" font-weight="400" text-anchor="start">파일을 만들고 고칩니다</text>
<path d="M622,192 L638,192" fill="none" stroke="#17406D" stroke-width="2" marker-end="url(#ai)"/>
<rect x="640" y="150" width="130" height="84" rx="4" fill="#EEF3F8" stroke="#17406D" stroke-width="1.5"/>
<text x="654" y="184" font-size="15" fill="#23272E" font-weight="700" text-anchor="start">⑤ 확인</text>
<text x="654" y="210" font-size="12" fill="#5A6675" font-weight="400" text-anchor="start">결과를 점검합니다</text>
<path d="M772,192 L788,192" fill="none" stroke="#2C7A4B" stroke-width="2" marker-end="url(#ag)"/>
<rect x="790" y="150" width="130" height="84" rx="4" fill="#EAF5EE" stroke="#2C7A4B" stroke-width="1.5"/>
<text x="804" y="184" font-size="15" fill="#2C7A4B" font-weight="700" text-anchor="start">⑥ 보고</text>
