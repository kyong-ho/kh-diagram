<text x="56" y="118.0" font-size="16" fill="#23272E" font-weight="700" text-anchor="start">&quot;막혔어. 원인부터 진단해 줘&quot;</text>
<text x="56" y="138.0" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">Codex에게 먼저 맡깁니다</text>
<path d="M340,121 L366,121 M366,123 L366,363" fill="none" stroke="#17406D" stroke-width="2"/>
<path d="M366,123 L392,123" fill="none" stroke="#17406D" stroke-width="2" marker-end="url(#ai)"/>
<path d="M366,203 L392,203" fill="none" stroke="#17406D" stroke-width="2" marker-end="url(#ai)"/>
