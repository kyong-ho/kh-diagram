<path d="M366,363 L392,363" fill="none" stroke="#17406D" stroke-width="2" marker-end="url(#ai)"/>
<rect x="396" y="90" width="524" height="66" rx="4" fill="#fff" stroke="#17406D" stroke-width="1.5"/>
<text x="412" y="114" font-size="15" fill="#23272E" font-weight="700" text-anchor="start">A. 요청 문제</text>
<text x="412" y="138" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">결과가 엉뚱함, 지어냄, 너무 많이 바꿈</text>
<text x="904" y="138" font-size="12.5" fill="#2C7A4B" font-weight="700" text-anchor="end">→ 4요소 중 빠진 것 채우기</text>
<rect x="396" y="170" width="524" height="66" rx="4" fill="#fff" stroke="#17406D" stroke-width="1.5"/>
<text x="412" y="194" font-size="15" fill="#23272E" font-weight="700" text-anchor="start">B. 대화 문제</text>
<text x="412" y="218" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">앞에서 한 말을 잊음</text>
<text x="904" y="218" font-size="12.5" fill="#2C7A4B" font-weight="700" text-anchor="end">→ 새 대화 + README·작업일지</text>
<rect x="396" y="250" width="524" height="66" rx="4" fill="#fff" stroke="#17406D" stroke-width="1.5"/>
<text x="412" y="274" font-size="15" fill="#23272E" font-weight="700" text-anchor="start">C. 작업 환경 문제</text>
<text x="412" y="298" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">파일을 못 찾음, 거절, 설치하려 함</text>
<text x="904" y="298" font-size="12.5" fill="#2C7A4B" font-weight="700" text-anchor="end">→ 연 폴더가 agent-practice인지 확인</text>
<rect x="396" y="330" width="524" height="66" rx="4" fill="#fff" stroke="#17406D" stroke-width="1.5"/>
<text x="412" y="354" font-size="15" fill="#23272E" font-weight="700" text-anchor="start">D. 화면 문제</text>
<text x="412" y="378" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start">브라우저에서 다르게 보임</text>
<text x="904" y="378" font-size="12.5" fill="#2C7A4B" font-weight="700" text-anchor="end">→ F5, 주소창 경로 확인</text>
<rect x="40" y="420" width="880" height="64" rx="4" fill="#FCEDEB" stroke="#C2362B" stroke-width="1.5"/>
<text x="60" y="446" font-size="14.5" fill="#C2362B" font-weight="700" text-anchor="start">15분이 넘으면 멈추고, 아래 세 칸을 적어 도움을 청합니다</text>
<text x="60" y="468" font-size="12.5" fill="#23272E" font-weight="400" text-anchor="start">하려던 것 / 시킨 말(그대로 복사) / 뜬 것(캡처)</text>
<path d="M190,154 L190,416" fill="none" stroke="#C2362B" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="204" y="300" font-size="13" fill="#C2362B" font-weight="700" text-anchor="start">해결되지 않으면</text>
<text x="40" y="520" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start">Codex는 원인을 한 줄로 말한 뒤 확인할 것을 하나씩 묻습니다. 해결되면 작업일지에 한 줄 남깁니다.</text>
